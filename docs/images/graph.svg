  <text x="70" y="662" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#5f6d8e">示意 · 真实关系图是真三维透视：拖拽轨道旋转、滚轮推拉、按深度遮挡；配色默认跟随当前主题，也可选 10 套预设</text>
